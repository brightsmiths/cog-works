# cargo-deny configuration file
# See https://embarkstudios.github.io/cargo-deny/

# Note: running `cargo deny check` requires this file to be at the root of the workspace

[advisories]
# Vulnerability database source; db-path defaults to $CARGO_HOME/advisory-dbs
db-urls = ["https://github.com/rustsec/advisory-db"]

# Ignore specific advisories (use with caution and document why)
# Most are transitive through third-party deps (azure_core <- queue-runtime).
# No upstream fix is available for any of them as of 2026-05-14, except where
# noted individually.
ignore = [
    # RUSTSEC-2023-0071: Marvin Attack timing side-channel in rsa 0.9.x
    # Source: rsa <- github-bot-sdk (webhook signature verification only;
    #         no decryption oracle exposed to attackers).
    { id = "RUSTSEC-2023-0071" },
    # RUSTSEC-2024-0384: `instant` crate unmaintained
    # Source: instant <- fastrand <- futures-lite <- http-types <- azure_core 0.21.0 <- queue-runtime 0.2.0
    # Risk: maintenance gap only; no security vulnerability identified.
    # Revisit when azure_core drops the http-types/fastrand dependency chain.
    { id = "RUSTSEC-2024-0384" },
    # RUSTSEC-2024-0436: `paste` crate unmaintained
    # Source: paste <- azure_core 0.21.0 <- queue-runtime 0.2.0
    # Risk: maintenance gap only; no security vulnerability identified.
    { id = "RUSTSEC-2024-0436" },
    # RUSTSEC-2026-0097: rand unsoundness with custom logger + thread_rng reseed
    # Source: rand 0.7.3 <- http-types 2.12.0 <- azure_core 0.21.0 <- queue-runtime 0.2.0
    # The 0.7.x line has no patched release; azure_core 0.21.0 still depends on
    # http-types 2.12.0 which pins rand ^0.7. CogWorks does not call rand in any
    # logger implementation, so the UB preconditions are not met.
    # Revisit when azure_core drops http-types or http-types upgrades rand.
    { id = "RUSTSEC-2026-0097" },
    # RUSTSEC-2026-0174: http-types Authorization/WwwAuthenticate can violate ASCII invariants
    # Source: http-types 2.12.0 <- azure_core 0.21.0 <- azure_messaging_servicebus 0.21.0 <- queue-runtime 0.2.0
    # http-types is unmaintained; no fix is available. CogWorks does not construct
    # Authorization or WwwAuthenticate headers directly; the affected code paths are
    # only reachable through azure_core's internal Service Bus authentication which
    # uses ASCII-safe credential values. Risk: low.
    # Revisit when azure_messaging_servicebus drops http-types.
    { id = "RUSTSEC-2026-0174" },
    # RUSTSEC-2026-0275: legacy azure_core writes the authorization header value to logs
    # Source: azure_core 0.21.0 <- azure_messaging_servicebus 0.21.0 <- queue-runtime 0.2.2
    # azure_messaging_servicebus has no release newer than 0.21.0; the legacy branch of
    # azure-sdk-for-rust is unsupported and MSRC declined to treat this as a
    # servicing-criteria vulnerability (see https://github.com/Azure/azure-sdk-for-rust/issues/5074).
    # The listener does not run with debug/trace logging enabled in production, so the
    # affected log statements are not emitted. Risk: low.
    # Revisit when queue-runtime migrates to a Service Bus client built on azure_core >=1.0.0.
    { id = "RUSTSEC-2026-0275" },
    # RUSTSEC-2026-0387: timing variability in crypto-bigint constant-time operations
    # Source: crypto-bigint 0.5.5 <- elliptic-curve 0.13.8 <- ecdsa/p256/p384 <-
    #         jsonwebtoken 10.4.0 <- github-bot-sdk 0.2.1 (github, listener, cli).
    # Fix requires crypto-bigint >=0.7.6, which needs a breaking bump through
    # elliptic-curve/ecdsa/p256/p384/jsonwebtoken; github-bot-sdk 0.2.1 is still
    # the latest available release and has not picked this up. CogWorks does not
    # call crypto-bigint directly; the affected code is reached only through
    # github-bot-sdk's JWT-based GitHub App authentication. Noted 2026-10-24.
    # Revisit when github-bot-sdk upgrades its JWT/ECDSA dependency chain.
    { id = "RUSTSEC-2026-0387" },
]

[licenses]
# Licenses we allow
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "OpenSSL",
]

# License clarity requirements
confidence-threshold = 0.8

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "allow"
# Wildcards (*) are not allowed in version requirements
# Exception: workspace git dependencies are allowed as wildcards since they're pinned by commit
wildcards = "allow"
# Highlight crates with specific issues
highlight = "all"

# List of crates that are allowed despite having duplicates
# (mostly Windows system dependencies that can't be unified easily)
skip = [
    { name = "windows_x86_64_gnullvm" },
    { name = "windows_x86_64_msvc" },
    { name = "windows_x86_64_gnu" },
    { name = "windows_i686_msvc" },
    { name = "windows-sys" },
    { name = "windows-targets" },
]

# Allow wildcards for external git dependencies (pinned by commit hash in workspace)
skip-tree = []

# Specific crate bans (if any)
deny = [
    # Deny old openssl versions
    #{ name = "openssl", version = "<0.10" },
]

[sources]
# Lint level for what to happen when a crate from a crate registry that is not
# in the allow list is encountered
unknown-registry = "deny"
unknown-git = "deny"

# Allowed registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# All first-party libraries now published to crates.io; no git sources needed.
allow-git = []
