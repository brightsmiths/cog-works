# cargo-audit configuration
# See https://github.com/rustsec/rustsec/tree/main/cargo-audit

[advisories]
# Advisory IDs to ignore.
# Each entry must include a documented reason — do not add ignores without
# explaining why the risk is accepted and what the remediation path is.
ignore = [
    # RUSTSEC-2023-0071: Marvin Attack timing side-channel in `rsa` v0.9.x
    # Severity: medium (CVSS 5.9)
    # Affected path: rsa <- github-bot-sdk (our own first-party library)
    # Status: No patched `rsa` version is available as of 2026-03-02.
    #         `github-bot-sdk` uses `rsa` only for JWT/webhook signature
    #         verification, not for long-term key storage or decryption of
    #         attacker-controlled ciphertext.  The attack requires many
    #         oracle queries against a live process; our webhook handler
    #         does not expose such an oracle.
    # Remediation: Upgrade `github-bot-sdk` as soon as an upstream fix or
    #              replacement crate (e.g. rsa 0.10) is released.
    #              Track via: https://github.com/RustCrypto/RSA/issues/19
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0275: legacy `azure_core` 0.21.0 writes the `authorization`
    # header value (bearer tokens, SharedKey signatures, SAS tokens) to logs at
    # debug/trace level.
    # Severity: medium (CVSS 6.5)
    # Affected path: azure_core 0.21.0 <- azure_messaging_servicebus 0.21.0 <- queue-runtime <- listener
    # Status: azure_messaging_servicebus has no release newer than 0.21.0; the
    #         `legacy` branch of azure-sdk-for-rust is unsupported and MSRC
    #         declined to treat this as a servicing-criteria vulnerability
    #         (see https://github.com/Azure/azure-sdk-for-rust/issues/5074).
    # Risk acceptance: the listener does not run with debug/trace logging enabled
    #                  in production, so the affected log statements are not emitted.
    # Remediation: remove this ignore once queue-runtime migrates to a
    #              Service Bus client built on azure_core >=1.0.0.
    "RUSTSEC-2026-0275",
]
