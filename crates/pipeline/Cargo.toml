[package]
name = "pipeline"
description = "CogWorks orchestration domain: types, business logic, and port trait definitions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# No I/O crates permitted here (see docs/spec/constraints.md §Module Boundaries).
# serde_json is a serialisation library (not I/O) and is permitted for Value types.
[dependencies]
thiserror = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
globset = { workspace = true }
indexmap = { workspace = true }
subtle = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true }
# Test-only: used by observability_tests.rs to build a custom `Layer` that
# captures structured fields recorded on a `tracing::Span` for assertion
# purposes. Never used from production code in this crate.
tracing-subscriber = { workspace = true }
