[package]
name = "nodes"
description = "CogWorks pipeline node implementations and LLM gateway."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pipeline = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
handlebars = { workspace = true }
# Required for the `pub(crate) trait NodeRunner` dyn-compatible async-fn seam
# in `executor.rs` (task #57, RED-phase scaffolding) — this trait lives in
# production code (not under `#[cfg(test)]`), so `async-trait` must be a
# regular dependency, not a dev-dependency.
async-trait = { workspace = true }
# Used by `executor.rs` to compute the constitutional-rules content hash
# (`ConstitutionalRules::source_hash`) and the `PipelineStateComment::graph_hash`
# digest. `pipeline::security`'s own SHA-256 helper is private to that crate,
# so `nodes::executor` computes its own hash using the same crate/algorithm
# for consistency (task #57). No longer test-only — promoted from
# dev-dependencies now that production code in this crate needs it.
sha2 = { workspace = true }

[dev-dependencies]
# Property-based tests for `BudgetTracker` concurrency invariants (PR 9) and
# for `HandlebarsTemplateEngine` (templates.rs, from master).
proptest = { workspace = true }
# Test-only: construct `pipeline::github::IssueComment::created_at` values
# (`chrono::DateTime<Utc>`) for `MockIssueTracker` fixtures in
# executor_tests.rs (task #57). Never used from production code in this crate.
chrono = { workspace = true }
