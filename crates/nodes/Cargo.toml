[package]
name = "nodes"
description = "CogWorks pipeline node implementations and LLM gateway."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pipeline = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
handlebars = { workspace = true }
# Required for the `pub(crate) trait NodeRunner` dyn-compatible async-fn seam
# in `executor.rs` (task #57, RED-phase scaffolding) — this trait lives in
# production code (not under `#[cfg(test)]`), so `async-trait` must be a
# regular dependency, not a dev-dependency.
async-trait = { workspace = true }

[dev-dependencies]
# Test-only: compute the SHA-256 hash of constitutional rules content so test
# fixtures can construct `ConstitutionalRules` values that pass
# `validate_constitutional_prompt`'s hash check, and to compute the expected
# `PipelineStateComment::graph_hash` for resume fixtures (executor_tests.rs).
# Never used from production code in this crate.
sha2 = { workspace = true }
# Property-based tests for `BudgetTracker` concurrency invariants (PR 9) and
# for `HandlebarsTemplateEngine` (templates.rs, from master).
proptest = { workspace = true }
# Test-only: construct `pipeline::github::IssueComment::created_at` values
# (`chrono::DateTime<Utc>`) for `MockIssueTracker` fixtures in
# executor_tests.rs (task #57). Never used from production code in this crate.
chrono = { workspace = true }
